<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lotti</title>
    <meta name="description" content="Lotti — plataforma inteligente de gestão imobiliária para imobiliárias e corretores." />
    <meta name="author" content="Lotti" />
    <meta name="google-site-verification" content="OmV6Vep1zH0dRisvVH3RJeGy8RsQOQLF_k1yKDWi2SE" />
    <meta name="theme-color" content="#09090b" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- A primeira ida à API (renovar a sessão) já encontra a conexão aberta. Dois pools no Chrome: com
         credencial (sessão) e sem (demais chamadas). -->
    <link rel="preconnect" href="%VITE_API_URL%" />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Lotti — CRM imobiliário inteligente" />
    <meta property="og:description" content="Plataforma inteligente de gestão imobiliária para imobiliárias e corretores." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Microsoft Clarity — analytics de comportamento. async, não defer: com defer o app esperava a
         revalidação deste arquivo (uma ida aos EUA) a cada visita, mesmo já estando no cache. -->
    <script src="/clarity-init.js" async></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
