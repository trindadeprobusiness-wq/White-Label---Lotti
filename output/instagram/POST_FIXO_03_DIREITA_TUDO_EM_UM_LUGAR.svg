<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Tudo em um só lugar.</title>
  <desc id="desc">Post da Lotti apresentando clientes, imóveis, CRM, contratos e financeiro em uma plataforma.</desc>
  <defs>
    <clipPath id="frame"><rect width="1080" height="1350"/></clipPath>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eee5" stop-opacity="0.58"/>
      <stop offset="0.55" stop-color="#f2eee5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2eee5" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1080" height="1350" fill="#e9e4da"/>
    <image href="assets/base-03-direita.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1080" height="1350" fill="url(#light)"/>
    <rect x="64" y="64" width="952" height="1222" rx="4" fill="none" stroke="#093323" stroke-opacity="0.22"/>

    <image href="assets/logo-lotti-preta.svg" x="80" y="145" width="255" height="82" preserveAspectRatio="xMinYMid meet"/>
    <text x="80" y="270" fill="#093323" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">03 / A PLATAFORMA</text>
    <line x1="80" y1="300" x2="270" y2="300" stroke="#093323" stroke-width="2"/>

    <text x="80" y="472" fill="#093323" font-family="Georgia, Times New Roman, serif" font-size="84" font-weight="400" letter-spacing="-2">
      <tspan x="80" dy="0">Tudo em</tspan>
      <tspan x="80" dy="98" font-style="italic">um só lugar.</tspan>
    </text>

    <g fill="#093323" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="650" letter-spacing="1">
      <circle cx="90" cy="738" r="6"/><text x="118" y="748">CLIENTES E OPORTUNIDADES</text>
      <circle cx="90" cy="806" r="6"/><text x="118" y="816">IMÓVEIS E UNIDADES</text>
      <circle cx="90" cy="874" r="6"/><text x="118" y="884">CRM E RELACIONAMENTO</text>
      <circle cx="90" cy="942" r="6"/><text x="118" y="952">CONTRATOS E DOCUMENTOS</text>
      <circle cx="90" cy="1010" r="6"/><text x="118" y="1020">FINANCEIRO E LOCAÇÕES</text>
    </g>

    <path d="M0 1055 H1080 V1350 H0 Z" fill="#093323" fill-opacity="0.96"/>
    <text x="80" y="1135" fill="#ffffff" font-family="Georgia, Times New Roman, serif" font-size="44" font-weight="400">
      <tspan x="80" dy="0">Mais organização.</tspan>
      <tspan x="80" dy="54">Mais controle. Mais vendas.</tspan>
    </text>
    <text x="998" y="1258" text-anchor="end" fill="#f2eee5" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="2">CONHEÇA A LOTTI →</text>
  </g>
</svg>
