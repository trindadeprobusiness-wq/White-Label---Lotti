project_id = "dqlolypbmsjgqrvdesev"

# Auth.getUser validates the bearer JWT before every channel operation.
[functions.lotti-whatsapp]
verify_jwt = false

[functions.generate-whatsapp-message]
verify_jwt = false

[functions.public-imoveis]
verify_jwt = false

[functions.imovel-detalhe]
verify_jwt = false

[functions.lead-capture]
verify_jwt = false

[functions.commercial-diagnostic]
verify_jwt = false

# Landing page pública da fachada (destino do QR). Sem login; usa service_role
# in-code e devolve só campos seguros (sem PII de proprietário).
[functions.fachada-publica]
verify_jwt = false

# O Asaas não envia Authorization: Bearer — a autenticação é feita pelo
# token do webhook (header asaas-access-token) dentro da própria função.
[functions.asaas-webhook]
verify_jwt = false

# asaas-sync valida a sessão do corretor in-code (auth.getUser); mantém o
# padrão das demais funções voltadas ao usuário.
[functions.asaas-sync]
verify_jwt = false

# Conexão self-service: recebe a chave apenas sobre HTTPS e valida a sessão
# dentro da função antes de cifrar/persistir. verify_jwt fica desligado no
# gateway pelo mesmo motivo de asaas-sync; a validação não foi removida.
[functions.asaas-conexao]
verify_jwt = false

# OAuth do Google volta sem JWT da Lotti; todas as rotas validam sessão, state
# ou segredo interno dentro da função. Webhook e sync também possuem guards
# próprios porque o Google não envia Authorization do Supabase.
[functions.google-calendar-auth]
verify_jwt = false

[functions.google-calendar-sync]
verify_jwt = false

[functions.google-calendar-webhook]
verify_jwt = false

[functions.routine-command]
verify_jwt = false

# Registro do clique no link do parceiro. Roda ANTES de existir conta — é o
# primeiro contato do visitante com a Lotti —, então não pode exigir JWT.
# A validação é o slug: só link ativo de parceiro ativo registra.
[functions.parceiro-clique]
verify_jwt = false

[functions.admin-suporte]
verify_jwt = true

# Public session credentials are validated inside the diagnostic handler.
[functions.diagnostic]
verify_jwt = false

# Internal worker requires DIAGNOSTIC_WORKER_SECRET, never a browser key.
[functions.diagnostic-notifications]
verify_jwt = false

[auth]
additional_redirect_urls = [
  "https://app.plataformalotti.com.br/nova-senha",
  "https://app.plataformalotti.com.br/auth/callback",
  "https://app.plataformalotti.com.br/nova-senha?redirectTo=%2Fparceiro",
  "https://app.plataformalotti.com.br/parceiro",
]

[auth.email.template.invite]
subject = "Seu convite para a Lotti"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Seu acesso ao Programa de Parceiros Lotti"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Redefina sua senha da Lotti"
content_path = "./supabase/templates/recovery.html"
